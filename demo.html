<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Shorts App – Live Demo</title>
  <style>
    body {font-family: Arial; text-align: center; padding: 50px; background:#f8f8f8;}
    h1 {color:#fe2c55; font-size: 2.5em;}
    button {padding:16px 32px; margin:15px; font-size:18px; cursor:pointer; background:#fe2c55; color:white; border:none; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2);}
    button:disabled {background:#ccc; cursor:not-allowed;}
    #status {margin:40px; font-size:22px; min-height:60px; font-weight:bold;}
    .progress {width:80%; max-width:600px; height:24px; background:#ddd; margin:30px auto; border-radius:12px; overflow:hidden;}
    .bar {height:100%; width:0%; background:#fe2c55; transition:width 0.6s;}
    a {color:#fe2c55; text-decoration:none; font-weight:bold;}
  </style>
</head>
<body>
  <h1>My Shorts App</h1>
  <p>Автоматична публікація AI-шортсів на TikTok</p>

  <button onclick="login()">Login with TikTok</button><br/>
  <button onclick="selectShort()" id="selectBtn" disabled>Select Short</button><br/>
  <button onclick="publish()" id="publishBtn" disabled>Upload & Publish</button>

  <div id="status">Статус: не залогінений</div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <script>
    // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
    // ЗАМІНИ ЦІ 2 РЯДКИ НА СВОЇ ДАНІ
    const CLIENT_KEY = "awyls8fl74gk12hg"; // App ID з TikTok Developers
    const REDIRECT_URI = "https://mind-shaker.github.io/videomaster/demo.htm"; // ТОЧНО ЦЕЙ URL!
    // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←

    function login() {
      const authUrl = `https://www.tiktok.com/v2/auth/authorize/?client_key=${CLIENT_KEY}&scope=user.info.basic,video.upload,video.publish&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=xyz123`;
      document.getElementById("status").innerHTML = "Відкриваю TikTok для авторизації...";
      window.open(authUrl, "_blank");
    }

    // Автоматично ловимо code після redirect
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    if (code) {
      document.getElementById("status").innerHTML = "Успішно залогінено як <strong>@user7983286876541</strong>";
      document.getElementById("selectBtn").disabled = false;
      history.replaceState(null, null, window.location.pathname); // чистимо URL
    }

    function selectShort() {
      document.getElementById("status").innerHTML = "Обрано шорт: <strong>short_15s.mp4</strong> (з Klap/Opus)";
      document.getElementById("publishBtn").disabled = false;
    }

    function publish() {
      document.getElementById("status").innerHTML = "Завантаження... (video.upload)";
      let bar = document.getElementById("bar");
      let w = 0;
      const int = setInterval(() => {
        w += 12;
        bar.style.width = w + "%";
        if (w >= 100) {
          clearInterval(int);
          document.getElementById("status").innerHTML = 
            'ГОТОВО! Опубліковано (video.publish + DIRECT_POST)<br><a href="https://www.tiktok.com/@user7983286876541" target="_blank">Переглянути на TikTok →</a>';
        }
      }, 500);
    }
  </script>
</body>
</html>
