<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Shorts App – Demo</title>
  <style>
    body {font-family: Arial; text-align: center; padding: 40px; background:#f0f0f0;}
    h1 {color:#fe2c55;}
    button {padding:15px 30px; margin:20px; font-size:18px; cursor:pointer; background:#fe2c55; color:white; border:none; border-radius:8px;}
    #status {margin:30px; font-size:20px; min-height:50px;}
    .progress {width:80%; height:20px; background:#ddd; margin:20px auto; border-radius:10px; overflow:hidden;}
    .bar {height:100%; width:0%; background:#fe2c55; transition:width 0.5s;}
  </style>
</head>
<body>
  <h1>My Shorts App</h1>
  <p>Автоматична публікація шортсів на TikTok</p>

  <button onclick="login()">Login with TikTok</button><br/>
  <button onclick="selectShort()" id="selectBtn" disabled>Select Short</button><br/>
  <button onclick="publish()" id="publishBtn" disabled>Upload & Publish</button>

  <div id="status">Статус: не залогінений</div>
  <div class="progress"><div class="bar" id="bar"></div></div>

  <script>
    let step = 0;
    function login() {
      document.getElementById("status").innerHTML = "Відкриваємо TikTok Login...";
      window.open("https://www.tiktok.com/login", "_blank");
      setTimeout(() => {
        document.getElementById("status").innerHTML = "Успішно залогінено як @your_nick";
        document.getElementById("selectBtn").disabled = false;
        step = 1;
      }, 4000);
    }

    function selectShort() {
      document.getElementById("status").innerHTML = "Обрано шорт: example_short.mp4 (з Klap)";
      document.getElementById("publishBtn").disabled = false;
      step = 2;
    }

    function publish() {
      document.getElementById("status").innerHTML = "Завантажуємо... (video.upload)";
      let bar = document.getElementById("bar");
      let w = 0;
      let int = setInterval(() => {
        w += 10;
        bar.style.width = w + "%";
        if (w >= 100) {
          clearInterval(int);
          document.getElementById("status").innerHTML = 
            'ГОТОВО! Опубліковано (video.publish)<br><a href="https://www.tiktok.com/@your_nick" target="_blank">Переглянути на TikTok</a>';
        }
      }, 600);
    }
  </script>
</body>
</html>
